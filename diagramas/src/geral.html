<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="estilo.css"></head><body>
<svg id="fig" width="1000" height="540" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg">
<defs>
 <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
 <marker id="aT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E5BB8"/></marker>
 <marker id="aS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C46A00"/></marker>
</defs>
<rect width="1000" height="540" fill="#fff"/>
<text x="500" y="34" text-anchor="middle" class="h" style="font-size:20px">Mini_CPU — visão geral do projeto</text>
<text x="500" y="56" text-anchor="middle" class="lab">Unidade de processamento da informação + unidade de controle (modelo da Aula 20)</text>

<!-- entradas -->
<line x1="250" y1="100" x2="250" y2="168" class="data" marker-end="url(#a)"/>
<text x="260" y="112" class="it">Entrada</text>
<text x="260" y="128" class="t">SW[17:0] (instrução)</text>
<line x1="750" y1="100" x2="750" y2="168" class="data" marker-end="url(#a)"/>
<text x="760" y="112" class="it">Entrada de controle</text>
<text x="760" y="128" class="t">KEY[3] ligar · KEY[2] enviar</text>
<text x="760" y="143" class="t">KEY[0] reset</text>

<!-- caixas -->
<rect x="80" y="170" width="340" height="180" rx="8" class="box"/>
<text x="250" y="202" text-anchor="middle" class="h">Unidade de processamento</text>
<text x="250" y="220" text-anchor="middle" class="h">da informação</text>
<text x="250" y="250" text-anchor="middle" class="t">IR (registrador de instrução)</text>
<text x="250" y="268" text-anchor="middle" class="t">memory.v — banco 16 × 16 bits</text>
<text x="250" y="286" text-anchor="middle" class="t">module_alu.v — ULA</text>
<text x="250" y="304" text-anchor="middle" class="t">RES (registrador de resultado)</text>
<text x="250" y="322" text-anchor="middle" class="t">bin2bcd.v · lcd_display.v</text>

<rect x="580" y="170" width="340" height="180" rx="8" class="ctl"/>
<text x="750" y="202" text-anchor="middle" class="h">Unidade de controle</text>
<text x="750" y="232" text-anchor="middle" class="t">Máquina de estados (FSM)</text>
<text x="750" y="250" text-anchor="middle" class="t">em module_mini_cpu.v</text>
<text x="750" y="280" text-anchor="middle" class="t">+ detector de soltura</text>
<text x="750" y="298" text-anchor="middle" class="t">dos botões</text>

<!-- status / controle -->
<line x1="420" y1="215" x2="578" y2="215" class="S" marker-end="url(#aS)"/>
<text x="500" y="205" text-anchor="middle" class="labS b">Status (S)</text>
<text x="500" y="233" text-anchor="middle" class="labS">busy, opcode</text>
<line x1="580" y1="300" x2="422" y2="300" class="T" marker-end="url(#aT)"/>
<text x="500" y="290" text-anchor="middle" class="labT b">Controle (T)</text>
<text x="500" y="318" text-anchor="middle" class="labT">carrega IR, carrega RES,</text>
<text x="500" y="333" text-anchor="middle" class="labT">we, clr, start, modo</text>

<!-- saida e clock -->
<line x1="250" y1="350" x2="250" y2="420" class="data" marker-end="url(#a)"/>
<rect x="150" y="420" width="200" height="60" rx="6" class="ext"/>
<text x="250" y="446" text-anchor="middle" class="h">LCD 16×2</text>
<text x="250" y="465" text-anchor="middle" class="lab">LCD_DATA, RS, RW, EN</text>
<text x="260" y="390" class="it">Saída</text>

<line x1="750" y1="430" x2="750" y2="352" class="data" marker-end="url(#a)"/>
<text x="750" y="450" text-anchor="middle" class="t">τ (clock) = CLOCK_50 (50 MHz)</text>
<text x="750" y="468" text-anchor="middle" class="lab">o mesmo clock vai para a unidade de processamento</text>
</svg></body></html>
